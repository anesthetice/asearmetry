[project]
name = "sofa_conversion"
version = "0.1.0"
description = "To handle conversions from `.sofa` files."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyarrow>=24.0.0",
    "pyfar>=0.8.0",
    "sofar>=1.2.3",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
]
