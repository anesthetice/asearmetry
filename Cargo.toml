[package]
name = "asearmetry"
version = "0.0.1"
edition = "2024"

[lib]
name = "asearmetry"
path = "src/lib.rs"

[[bin]]
name = "asearmetry-app"
path = "src/app/main.rs"

[dependencies]
anyhow = { version = "1.0" }
approx = { version = "0.5" }
hound = { version = "3.5" }
itertools = { version = "0.14" }
num-traits = { version = "0.2" }
rand = { version = "0.10" }
rstar = { version = "0.12" }
symphonia = { version = "0.5" }

# optional dependencies
polars = { version = "0.53", default-features = false, features = ["fmt", "parquet"], optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
bitcode = { version = "0.6", optional = true, features = ["derive"] }

[features]
default = ["polars", "bitcode", "serde"]
bitcode = ["dep:bitcode"]
polars = ["dep:polars"]
serde = ["dep:serde"]


[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
codegen-units = 1
